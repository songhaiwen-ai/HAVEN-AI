version: '3.8'

services:
  # ============================================================================
  # 1. MySQL 8.0 数据库服务
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: haven_mysql
    restart: always
    command: --innodb_buffer_pool_size=32M --key_buffer_size=16M --max_connections=30 --performance_schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: haven_agent
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-123456} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================================
  # 2. FastAPI 后端 API 服务 (读取本地未提交的 .env 环境变量)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haven_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  # ============================================================================
  # 3. Vue 3 + Nginx 前端 Web 控制台
  # ============================================================================
  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: haven_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
