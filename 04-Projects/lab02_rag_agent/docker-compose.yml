version: '3.8'

services:
  # ============================================================================
  # 1. FastAPI 后端 API 服务 (读取 .env 中配置的独立数据库地址 MYSQL_URL)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haven_backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"

  # ============================================================================
  # 2. Vue 3 + Nginx 前端 Web 控制台
  # ============================================================================
  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: haven_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
